// ========== 状态管理 ==========
let currentQuestion = 0;
let scores = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0 };

// ========== 开始答题 ==========
function startQuiz() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').classList.add('active');
  showQuestion(0);
}

// ========== 显示题目 ==========
function showQuestion(index) {
  const q = questions[index];
  const qText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const counter = document.getElementById('questionCounter');
  const progressFill = document.getElementById('progressFill');

  qText.classList.remove('fade-in');
  void qText.offsetWidth;
  qText.classList.add('fade-in');
  qText.textContent = q.q;

  counter.textContent = `第 ${index + 1} 题 / 共 ${questions.length} 题`;
  progressFill.style.width = ((index + 1) / questions.length * 100) + '%';

  optionsContainer.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option fade-in';
    btn.style.animationDelay = (i * 0.08) + 's';
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(opt.scores);
    optionsContainer.appendChild(btn);
  });
}

// ========== 选择选项 ==========
function selectOption(optionScores) {
  for (let key in optionScores) {
    scores[key] += optionScores[key];
  }

  currentQuestion++;
  if (currentQuestion < questions.length) {
    setTimeout(() => showQuestion(currentQuestion), 200);
  } else {
    setTimeout(() => showResult(), 300);
  }
}

// ========== 显示结果 ==========
function showResult() {
  // 找出得分最高的维度
  let maxScore = 0;
  let maxKey = 'A';
  for (let key in scores) {
    if (scores[key] > maxScore) {
      maxScore = scores[key];
      maxKey = key;
    }
  }

  const p = personalities[maxKey];

  document.getElementById('quizScreen').classList.remove('active');
  document.getElementById('resultScreen').classList.add('active');

  document.getElementById('resultIcon').innerHTML = p.icon;
  document.getElementById('resultTitle').textContent = p.title;
  document.getElementById('resultSubtitle').textContent = p.subtitle;
  document.getElementById('resultDesc').textContent = p.desc;
  document.getElementById('resultSoul').textContent = p.soul;

  const traitsContainer = document.getElementById('resultTraits');
  traitsContainer.innerHTML = '';
  p.traits.forEach(t => {
    const span = document.createElement('span');
    span.className = 'trait';
    span.textContent = t;
    traitsContainer.appendChild(span);
  });

  // 生成人格代码（第一个字母就是类型编码）
  const codeNum = Math.floor(Math.random() * 90 + 10);
  const codeSuffix = Math.random().toString(36).substring(2, 6).toUpperCase();
  document.getElementById('resultCode').textContent = `HG-${maxKey}${codeNum}-${codeSuffix}`;

  // 滚动到顶部
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ========== 分享结果 ==========
function shareResult() {
  const title = document.getElementById('resultTitle').textContent;
  const subtitle = document.getElementById('resultSubtitle').textContent;
  const code = document.getElementById('resultCode').textContent;

  const traits = Array.from(document.querySelectorAll('.trait')).map(t => t.textContent).join(' · ');

  const shareText =
`🔮 我的隐藏人格是【${title}】
"${subtitle}"

✦ 人格特质：${traits}

据说这个测试超准的！
你也来测测你的隐藏人格是什么吧~

【人格代码：${code}】
https://`; // 链接占位，你可以部署后填真实链接

  // 复制到剪贴板
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(shareText).then(() => {
      showToast();
    }).catch(() => {
      fallbackCopy(shareText);
    });
  } else {
    fallbackCopy(shareText);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showToast();
  } catch (e) {
    alert('复制失败，请手动复制结果页面的内容~');
  }
  document.body.removeChild(textarea);
}

function showToast() {
  const toast = document.getElementById('copyToast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ========== 重新测试 ==========
function restartQuiz() {
  currentQuestion = 0;
  scores = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0 };
  document.getElementById('resultScreen').classList.remove('active');
  document.getElementById('startScreen').style.display = 'flex';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
